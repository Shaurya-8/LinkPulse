services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: linkpulse-backend:latest
    container_name: linkpulse
    ports:
      - "8000:8000"
    env_file:
      - .env
    
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
      - /app/node_modules
    command: pnpm dev

  postgres:
    image: postgres:17-alpine
    container_name: linkpulse_postgres_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: linkpulse
      POSTGRES_PASSWORD: LinkPulse@
      POSTGRES_DB: Linkpulse_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
#  docker exec -it linkpulse_postgres_db psql -U linkpulse -d Linkpulse_db
  redis:
    image: redis:8.8.0-alpine
    container_name: linkpulse_redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
